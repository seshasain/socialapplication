[[build.env]]
name = "GOOGLE_NODEJS_EXTRA_ARGS"
value = "--legacy-peer-deps"

[[build.env]]
name = "NODE_ENV"
value = "production"

[[build.env]]
name = "NPM_CONFIG_LEGACY_PEER_DEPS"
value = "true"

[[build.env]]
name = "NPM_CONFIG_PRODUCTION"
value = "false"

[build]
include = [
    "package.json",
    "package-lock.json",
    ".npmrc",
    "server/**/*",
    "prisma/**/*",
    "dist/**/*"
] 