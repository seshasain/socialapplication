steps:
  # Build using Cloud Native Buildpacks
  - name: 'gcr.io/k8s-skaffold/pack'
    env:
      - 'GOOGLE_NODEJS_EXTRA_ARGS=--legacy-peer-deps'
      - 'NODE_ENV=production'
      - 'NPM_CONFIG_LEGACY_PEER_DEPS=true'
    args:
      - build
      - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/${_SERVICE}:${COMMIT_SHA}'
      - '--builder=gcr.io/buildpacks/builder:v1'
      - '--path=.'
      - '--env=GOOGLE_NODEJS_EXTRA_ARGS=--legacy-peer-deps'
      - '--env=NODE_ENV=production'
      - '--env=NPM_CONFIG_LEGACY_PEER_DEPS=true'

  # Deploy to Cloud Run
  - name: 'gcr.io/cloud-builders/gcloud'
    args:
      - 'run'
      - 'deploy'
      - '${_SERVICE}'
      - '--image'
      - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/${_SERVICE}:${COMMIT_SHA}'
      - '--region'
      - '${_REGION}'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'

substitutions:
  _REGION: 'us-central1'
  _REPOSITORY: 'cloud-run-source-deploy'
  _SERVICE: 'crosspodium-api'

options:
  logging: CLOUD_LOGGING_ONLY 